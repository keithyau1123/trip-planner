<script>
/* ===== 地圖模組：開源 Leaflet fallback ＋（選填）Google Maps key 模式 =====
   - 沒有 Google Maps API key：Leaflet + CARTO 灰階底圖，依交通方式著色線形，
     地點點兩下直接開啟 Google Maps 導航。
   - 有 key：改載 Google Maps JS SDK，灰階自訂樣式＋淡藍水域，
     用 DirectionsService 取路段線形與預估時間。
*/
const GEO_CACHE_KEY = 'jp-trip-geo-cache-v1';
/* CARTO Basemaps 免費 key（非商業 5,000,000 瓦片/月）：2025 年底起，舊嘅無 key
   底圖 URL 會統一返回一張印住「API KEY REQUIRED」嘅佔用瓦片（任何 zoom 都係
   同一張 2049 字節 PNG），所以而家必須行帶 key 嘅 /rastertiles/ endpoint。
   呢個係公開 client 端 key；萬一被人盗用超額，去 https://dashboard.basemaps.carto.com/keys
   重發一張，再改下面呢一行推上去就得。 */
const CARTO_BASEMAP_KEY = 'cb1_585g_1_311000e1d39709b9504d6e47';
/* localStorage 安全包裝：Apps Script HtmlService 嘅 sandbox iframe 有可能禁 localStorage，
   禁咗就淨係用記憶體快取（每次開頁重新 geocode），唔好撻死成個 app。 */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 沙箱唔畀用：忽略 */ } }
const geoCache = JSON.parse(lsGet(GEO_CACHE_KEY) || '{}');

const MapX = (() => {
  let el = null, leaf = null, gmap = null, mode = 'leaflet', key = '';
  let layer = null;
  let lastEvts = null, lastRoute = true; // 供 Google 驗證失敗時退回 Leaflet 重畫

  function init(element) { el = element; }

  /* --- geocode（Nominatim，限速 ≥1.1s/req，含快取與去重） --- */
  const inflight = new Map();
  let lastGeo = 0;
  function geocode(q) {
    if (!q) return Promise.resolve(null);
    if (geoCache[q]) return Promise.resolve(geoCache[q]);
    if (inflight.has(q)) return inflight.get(q);
    const p = slowLookup(q).then(ll => { inflight.delete(q); return ll; });
    inflight.set(q, p);
    return p;
  }
  async function slowLookup(q) {
    const wait = 1100 - (Date.now() - lastGeo);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    lastGeo = Date.now();
    let ll = null;
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), { headers: { 'Accept-Language': 'zh' } });
      const j = await r.json();
      if (j[0]) { ll = [ +j[0].lat, +j[0].lon ]; geoCache[q] = ll; lsSet(GEO_CACHE_KEY, JSON.stringify(geoCache)); }
    } catch (e) { /* 離線或被擋：略過 */ }
    return ll;
  }

  /* 從事件排出可的地點節點與路段 */
  function nodesAndLegs(evts) {
    const sorted = [...evts].sort((a, b) => a.startMin - b.startMin);
    const nodes = [], legs = [];
    let lastNode = null, pendModes = [], pendMin = 0;
    for (const e of sorted) {
      if (e.category === 'transit') { pendModes.push(e.mode || 'train'); pendMin += e.durationMin; continue; }
      if (e.category === 'stay' && !e.address) continue;
      const node = { e, ll: geoCache[e.address || e.name] || null };
      if (lastNode) {
        const modes = pendModes.length ? pendModes : ['walk'];
        const allWalk = modes.every(m => m === 'walk');
        legs.push({ a: lastNode, b: node, mode: allWalk ? 'walk' : modes[modes.length - 1], allWalk, min: pendMin, merged: modes.length });
      }
      nodes.push(node); lastNode = node; pendModes = []; pendMin = 0;
    }
    return { nodes, legs };
  }

  async function osrmRoute(a, b) {
    if (!a || !b) return null;
    try {
      const c = new AbortController(); const t = setTimeout(() => c.abort(), 4500);
      const r = await fetch(`https://router.project-osrm.org/route/v1/foot/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`, { signal: c.signal });
      clearTimeout(t);
      const j = await r.json();
      if (j.routes && j.routes[0]) return j.routes[0].geometry.coordinates.map(p => [p[1], p[0]]);
    } catch (e) {}
    return null;
  }

  const LEG_COLOR = { train:'#4678C5', metro:'#9266C2', shinkansen:'#D8902C', bus:'#3A9B80', walk:'#84909E', taxi:'#D77968', car:'#4678C5', plane:'#9266C2' };

  /* ---------- Leaflet 繪製 ---------- */
  async function drawLeaflet(evts, showRoute) {
    if (!leaf) {
      leaf = L.map(el, { scrollWheelZoom: true, zoomControl: true });
      L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=${CARTO_BASEMAP_KEY}`,
        { maxZoom: 18, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © CARTO' }).addTo(leaf);
      layer = L.layerGroup().addTo(leaf);
    }
    layer.clearLayers();
    const { nodes, legs } = nodesAndLegs(evts);
    for (const n of nodes) if (!n.ll) n.ll = await geocode(n.e.address || n.e.name);
    const pts = [];
    nodes.forEach((n, i) => {
      if (!n.ll) return;
      pts.push(n.ll);
      const mk = L.circleMarker(n.ll, { radius: 8, fillColor: '#fff', color: '#555555', weight: 3 });
      const label = `${n.e.name}<br><small>${fmtHM(n.e.startMin)}–${fmtHM(n.e.startMin + n.durationMin)}</small>` +
        `<br><a target="_blank" rel="noopener" href="${navUrl(n.e)}">🧭 導航</a>`;
      mk.bindPopup(label);
      mk.on('dblclick', () => window.open(navUrl(n.e), '_blank'));
      const day = document.querySelector('.tl-station.sel')?.dataset.di;
      mk.on('click', () => { /* 預覽：置中放大 */ leaf.setView(n.ll, Math.max(leaf.getZoom(), 14), { animate: true }); });
      mk.addTo(layer);
      const tag = L.marker(n.ll, { interactive: false, icon: L.divIcon({ className: '', html: `<div class="day-pin" style="background:${catColor(n.e.category)}">${n.e.startMin / 60 | 0}</div>`, iconSize: [12, 12] }) });
      tag.addTo(layer);
    });
    if (showRoute) {
      for (const lg of legs) {
        if (!lg.a.ll || !lg.b.ll) continue;
        let line = null;
        if (lg.allWalk) line = await osrmRoute(lg.a.ll, lg.b.ll);
        if (!line) line = [lg.a.ll, lg.b.ll];
        L.polyline(line, { color: LEG_COLOR[lg.mode] || '#84909E', weight: 4, opacity: .9, dashArray: lg.allWalk ? '2 7' : null }).addTo(layer);
      }
    }
    if (pts.length) leaf.fitBounds(pts, { padding: [40, 40] });
    else { leaf.setView([35.68, 139.69], 6); }
    noteFallback(evts.length);
  }
  function noteFallback(n) {
    let a = el.parentElement.querySelector('.maplink');
    if (!a) { a = document.createElement('div'); a.className = 'maplink'; el.parentElement.insertBefore(a, el.nextSibling); }
    a.innerHTML = mode === 'leaflet'
      ? `開源 Leaflet 地圖 · CARTO 灰階底圖（帶免費底圖 key，與 Google Maps key 無關）`
      : `Google Maps 模式 · 已載入自訂樣式`;
  }

  /* ---------- Google 模式 ---------- */
  function loadGoogle(k) {
    return new Promise((res, rej) => {
      window.gm_authFailure = () => {
        key = ''; mode = 'leaflet'; gmap = null;
        if (el) { el.innerHTML = ''; leaf = null; layer = null; if (lastEvts) drawLeaflet(lastEvts, lastRoute); }
        toast('Google Maps key 驗證失敗（無效或額度問題），已改用開源地圖');
      };
      if (window.__gmapsCb) return res(window.google);
      window.__gmapsCb = () => res(window.google);
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(k)}&callback=__gmapsCb&loading=async`;
      s.onerror = rej; document.head.appendChild(s);
      setTimeout(() => window.google?.maps ? res(window.google) : rej(new Error('gmaps load timeout')), 12000);
    });
  }
  const G_STYLES = [
    { elementType: 'geometry', stylers: [{ color: '#e6e4e0' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#4a4744' }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#A8D3E6' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
    { featureType: 'poi', elementType: 'all', stylers: [{ visibility: 'off' }] },
    { featureType: 'transit', elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
  ];
  async function drawGoogle(evts, showRoute) {
    const gm = await loadGoogle(key);
    if (!gmap) {
      gmap = new gm.maps.Map(el, { center: { lat: 35.68, lng: 139.69 }, zoom: 6, styles: G_STYLES, disableDefaultUI: false, mapTypeControl: false, streetViewControl: false });
      gmap.setOptions({ gestureHandling: 'greedy' });
    }
    // 清掉舊覆蓋物
    (gmap.__over = gmap.__over || []).forEach(o => o.setMap(null));
    gmap.__over = [];
    const bounds = new gm.maps.LatLngBounds();
    const sorted = [...evts].sort((a, b) => a.startMin - b.startMin);
    const fitLater = () => { try { gmap.fitBounds(bounds, 40); } catch (e) {} };
    const isNode = e => e.category !== 'transit' && !(e.category === 'stay' && !e.address);
    let any = false;
    for (const e of sorted) {
      if (!isNode(e)) continue;
      any = true;
      const mk = new gm.maps.Marker({ map: gmap, title: e.name });
      gmap.__over.push(mk);
      const resolve = loc => {
        mk.setPosition(loc);
        mk.addListener('dblclick', () => window.open(navUrl(e), '_blank')); // 點兩下直接導航
        mk.addListener('click', () => gmap.panTo(loc));
        bounds.extend(loc);
        fitLater();
      };
      const q = e.address || e.name;
      if (gm.maps.places && gm.maps.places.search) {
        gm.maps.places.search({ query: q, fields: ['place_id', 'geometry', 'displayName'] })
          .then(res => { const p = res?.places?.[0]; if (p) resolve(p.geometry.location); })
          .catch(() => {});
      } else {
        const GC = (gm.maps.places && gm.maps.places.Geocoder) || gm.maps.Geocoder;
        const gc = new GC();
        gc.geocode({ address: q }, (r, s) => { if (s === 'OK' && r[0]) resolve(r[0].geometry.location); });
      }
    }
    if (showRoute) {
      const nodeIdx = [];
      sorted.forEach((e, i) => { if (isNode(e)) nodeIdx.push(i); });
      for (let k = 1; k < nodeIdx.length; k++) {
        const prev = sorted[nodeIdx[k - 1]], next = sorted[nodeIdx[k]];
        const pends = sorted.slice(nodeIdx[k - 1] + 1, nodeIdx[k]).filter(e => e.category === 'transit');
        const modeE = pends.length ? pends[pends.length - 1].mode : 'walk';
        const allWalk = pends.length && pends.every(p => p.mode === 'walk');
        const travelMode = allWalk ? 'WALKING' : (modeE === 'taxi' || modeE === 'car') ? 'DRIVING'
          : modeE === 'plane' ? 'PLANE' : 'TRANSIT';
        if (travelMode === 'PLANE') continue; // 航班不請 Directions 算線形
        const ds = new gm.maps.DirectionsService();
        ds.route({ origin: prev.address || prev.name, destination: next.address || next.name, travelMode }, (res, status) => {
          if (status !== 'OK' || !res?.routes?.[0]) return;
          const leg = res.routes[0].legs[0];
          const pl = new gm.maps.Polyline({ map: gmap, path: leg.overview_path, strokeColor: LEG_COLOR[modeE] || '#84909E', strokeWeight: 4, strokeOpacity: .95 });
          gmap.__over.push(pl);
          bounds.extend(leg.start_location); bounds.extend(leg.end_location); fitLater();
          if (window.AppX && AppX.applyRouteResult) AppX.applyRouteResult(next.id, leg.duration?.value, leg.distance?.text, leg.fare?.value?.currency);
        });
      }
    }
    if (!any) gmap.setCenter({ lat: 35.68, lng: 139.69 });
    noteFallback(evts.length);
    return true;
  }

  async function showDay(evts, opts = {}) {
    const showRoute = opts.route !== false;
    lastEvts = evts; lastRoute = showRoute;
    if (mode === 'google' && key) {
      try { return await drawGoogle(evts, showRoute); }
      catch (e) { mode = 'leaflet'; toast('Google Maps 載入失敗，改用開源地圖'); }
    }
    await drawLeaflet(evts, showRoute);
  }

  async function setKey(k) {
    key = (k || '').trim();
    mode = key ? 'google' : 'leaflet';
    if (key) { try { await loadGoogle(key); } catch (e) { mode = 'leaflet'; } }
    if (mode === 'leaflet' && !leaf && el) { await drawLeaflet([], false); }
  }

  /* A→B 公共交通班次（Google Directions TRANSIT）：幾個方案一次過顯示，
     等於「miss 咗呢班，接住仲有邊班」；出發時間可將來未來任何一刻。
     冇 Google（leaflet 模式）就回 NO_KEY，由 app.js 彈提示。 */
  function transitSearch(qa, qb, departMs) {
    return new Promise(resolve => {
      const g = window.google;
      if (!g || !g.maps || !g.maps.DirectionsService) { resolve({ error: 'NO_KEY' }); return; }
      const req = {
        origin: qa, destination: qb,
        travelMode: 'TRANSIT',
        provideRouteAlternatives: true,
      };
      if (g.maps.UnitSystem) req.unitSystem = g.maps.UnitSystem.METRIC;
      if (departMs) req.departureTime = new Date(departMs);
      new g.maps.DirectionsService().route(req, (res, status) => {
        if (status !== 'OK' || !res || !res.routes || !res.routes.length) { resolve({ error: String(status || 'ZERO_RESULTS') }); return; }
        resolve({
          routes: res.routes.slice(0, 5).map(r => ({
            summary: r.summary || '',
            legs: (r.legs || []).map(l => ({
              mode: String(l.travel_mode || 'WALKING').toUpperCase(),
              line: (l.vehicle && l.vehicle.name) || '',
              short: (l.vehicle && l.vehicle.short_names) ? l.vehicle.short_names.join('/') : '',
              head: l.head_sign || '',
              from: l.start_address || '',
              to: l.end_address || '',
              dep: (l.departure_time && l.departure_time.getTime) ? l.departure_time.getTime() : null,
              arr: (l.arrival_time && l.arrival_time.getTime) ? l.arrival_time.getTime() : null,
              dur: (l.duration && l.duration.value) ? l.duration.value : null,
              dist: (l.distance && l.distance.text) || '',
            })),
          })),
        });
      });
    });
  }

  return { init, showDay, setKey, transitSearch, get mode() { return mode; } };
})();

function navUrl(e) {
  const q = encodeURIComponent(e.address || e.name);
  return `https://www.google.com/maps/dir/?api=1&destination=${q}`;
}
</script>

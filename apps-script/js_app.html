<script>
/* ================= 旅行規劃主程式 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- 狀態 ---------- */
const STORE_KEY = 'jp-trip-state-v1';
/* Apps Script 雲端模式：有 google.script.run 即代表呢個頁面行緊喺 Apps Script Web App
   （Google 登入＋全域名門禁），行程每個使用者自己一份（UserProperties 雲端）。
   GitHub Pages 版呢度係 false，繼續用瀏覽器本機 localStorage。 */
const CLOUD = !!(window.google && window.google.script && window.google.script.run);
const DEFAULT_TRIP = {
  name: '我的日本之旅', destination: '', timezone: 'Asia/Tokyo',
  startDate: '', endDate: '', currency: 'JPY', settleCurrency: 'HKD', rate: 0.055,
  adults: 2, children: 0, childAges: '', dayStart: '08:30', dayEnd: '21:30',
};
const DEFAULT_SETTINGS = { mapsKey: '', showCost: false, view: 'week', routeOpen: true, mapMode: 'route', dayArt: {} };
let state = {
  trip: { ...DEFAULT_TRIP }, settings: { ...DEFAULT_SETTINGS },
  events: [], packing: [], est: {}, sel: { dayIndex: 0 },
};
function applyState(saved) {
  if (!saved) return;
  state = { ...state, ...saved, trip: { ...DEFAULT_TRIP, ...(saved.trip || {}) }, settings: { ...DEFAULT_SETTINGS, ...(saved.settings || {}) } };
}
try { applyState(JSON.parse(lsGet(STORE_KEY) || 'null')); } catch (e) { /* 損毀則重來 */ }
let saveT = null, cloudT = null, cloudBusy = false, cloudPend = false, lastSync = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { lsSet(STORE_KEY, JSON.stringify(state)); }, 120); // 本機鏡像（雲端模式都做備份）
  if (CLOUD) { setChip('⏳ 未同步…'); clearTimeout(cloudT); cloudT = setTimeout(pushCloud, 800); }
}
function setChip(txt) {
  const c = $('#cloudchip'); if (!c) return;
  c.hidden = !txt; c.textContent = txt || '';
  c.title = lastSync ? '最後同步：' + new Date(lastSync).toLocaleString() : '雲端同步狀態';
}
function pushCloud() {
  if (cloudBusy) { cloudPend = true; return; }
  cloudBusy = true;
  const payload = JSON.stringify({ trip: state.trip, events: state.events, packing: state.packing, settings: state.settings, est: state.est, sel: state.sel });
  google.script.run
    .withSuccessHandler(info => {
      cloudBusy = false; lastSync = (info && info.savedAt) || Date.now();
      const who = (info && info.email) || (typeof USER_EMAIL !== 'undefined' ? USER_EMAIL : '');
      setChip(who ? '☁ ' + who : '☁ 已同步');
      if (cloudPend) { cloudPend = false; pushCloud(); }
    })
    .withFailureHandler(err => {
      cloudBusy = false;
      setChip('⚠️ 同步失敗 · 2 秒後自動重試' + ((err && err.message) ? '（' + err.message + '）' : ''));
      if (cloudPend) cloudPend = false;
      clearTimeout(cloudT); cloudT = setTimeout(pushCloud, 2000);
    })
    .saveAll(payload);
}

/* ---------- 復原 ---------- */
const history = [];
function snapshot() { return JSON.stringify({ events: state.events, packing: state.packing, est: state.est, trip: state.trip }); }
function pushUndo() { history.push(snapshot()); if (history.length > 40) history.shift(); $('#undoBtn').disabled = false; }
function undo() {
  if (!history.length) { toast('沒有可復原的動作了'); return; }
  const s = JSON.parse(history.pop());
  state.events = s.events; state.packing = s.packing; state.est = s.est; state.trip = s.trip;
  save(); renderAll(); toast('已復原');
  $('#undoBtn').disabled = history.length === 0;
}

/* ---------- 時間／日期 ---------- */
function parseHM(s) { const m = /^(\d{1,2})[:：](\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function fmtHM(min) { min = ((min % 1440) + 1440) % 1440; return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }
function fmtDur(min) {
  if (min < 60) return min + '分';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? h + '小時' + m + '分' : h + '小時';
}
function dateAdd(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dateValid(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(iso) && !isNaN(+new Date(iso + 'T12:00:00Z')); }
const WEEKDAY = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
function weekday(iso) { return WEEKDAY[new Date(iso + 'T12:00:00Z').getUTCDay()]; }
function tzNowInTrip() {
  const tz = state.trip.timezone;
  try {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
    const g = t => parts.find(p => p.type === t)?.value || '00';
    return { date: `${g('year')}-${g('month')}-${g('day')}`, min: (+g('hour')) * 60 + (+g('minute')) };
  } catch (e) { const d = new Date(); return { date: d.toISOString().slice(0, 10), min: d.getHours() * 60 + d.getMinutes() }; }
}
function tzOffsetMin(tz, isoDate) {
  try {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(isoDate + 'T12:00:00Z'));
    const g = t => +parts.find(p => p.type === t).value;
    return Math.round((Date.UTC(g('year'), g('month') - 1, g('day'), g('hour') % 24, g('minute'), g('second')) - new Date(isoDate + 'T12:00:00Z').getTime()) / 60000);
  } catch (e) { return 0; }
}
function icsOffsetStr(min) { const s = min < 0 ? '-' : '+'; min = Math.abs(min); return s + pad2(Math.floor(min / 60)) + pad2(min % 60); }

/* ---------- 日數 ---------- */
function getDays() {
  const { startDate, endDate } = state.trip;
  if (dateValid(startDate) && dateValid(endDate) && endDate >= startDate) {
    const out = []; for (let d = startDate; d <= endDate; d = dateAdd(d, 1)) { out.push(d); if (out.length > 60) break; }
    return out;
  }
  const ds = state.events.map(e => e.date).filter(dateValid);
  if (ds.length) {
    const a = ds.slice().sort()[0], b = ds.slice().sort().pop();
    if (dateValid(startDate) && startDate < a) return daterange(startDate, b);
    return daterange(a, b);
  }
  if (dateValid(startDate)) return [startDate];
  return [tzNowInTrip().date];
}
function daterange(a, b) { const out = []; for (let d = a; d <= b && out.length < 60; d = dateAdd(d, 1)) out.push(d); return out; }
function dayEvents(di) { const days = getDays(); const d = days[clamp(di, 0, days.length - 1)] ?? days[0]; return state.events.filter(e => e.date === d); }
function evSorted(evts) { return [...evts].map(e => { e.startMin = parseHM(e.start) ?? 480; return e; }).sort((a, b) => a.startMin - b.startMin); }

/* ---------- 金額 ---------- */
function catHex(cat) { return { sight: '#F6D27A', food: '#F2A497', stay: '#A8D3E6', transit: '#B9DAA5', flight: '#B9DAA5' }[cat] || '#F6D27A'; }
function catName(cat) { return { sight: '景點', food: '餐飲', stay: '住宿', transit: '交通', flight: '航班' }[cat] || cat; }
function catColor(cat) { return catHex(cat); } // map.js 使用
function headcount() { return (+state.trip.adults || 1) + (+state.trip.children || 0); }
function settleAmt(e) { // 先換算再合計（單筆取整）
  if (e.cost == null || e.cost === '' || isNaN(+e.cost)) return null;
  let amt = +e.cost;
  if (e.costWho === 'person') amt *= headcount();
  if (state.trip.currency !== state.trip.settleCurrency) amt *= (+state.trip.rate || 0);
  return Math.round(amt);
}
function localAmt(e) {
  if (e.cost == null || e.cost === '' || isNaN(+e.cost)) return null;
  let amt = +e.cost; if (e.costWho === 'person') amt *= headcount();
  return Math.round(amt);
}
function totalsByCat() {
  const t = { sight: 0, food: 0, stay: 0, transit: 0, flight: 0 }, estCount = { sight: 0, food: 0, stay: 0, transit: 0, flight: 0 };
  for (const e of state.events) {
    const s = settleAmt(e);
    if (s == null) { estCount[e.category] = (estCount[e.category] || 0) + 1; continue; }
    t[e.category] = (t[e.category] || 0) + s;
  }
  return { t, estCount };
}
function grandSettle() { const { t } = totalsByCat(); return Object.values(t).reduce((a, b) => a + b, 0); }
function fmtMoney(n, cur) {
  try { return new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 }).format(n) + ' ' + cur; }
  catch (e) { return Math.round(n) + ' ' + cur; }
}

/* ---------- toast ---------- */
let toastT = null;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 4000);
}

/* ---------- 頁首 ---------- */
function renderHeader() {
  $('#tripTitle').textContent = state.trip.name || '未命名旅程';
  $('#chipDest').textContent = state.trip.destination || '尚未設定目的地';
  const days = getDays();
  $('#chipDays').textContent = `共 ${days.length} 天`;
  $('#chipPlaces').textContent = state.events.filter(e => e.category !== 'transit').length + ' 個地點';
  const total = grandSettle();
  const span = $('#eyeTotal');
  span.hidden = !state.settings.showCost;
  span.textContent = `≈ ${fmtMoney(total, state.trip.settleCurrency)}`;
  $('#eyeBtn').setAttribute('aria-pressed', String(!!state.settings.showCost));
}

/* ---------- 週行事曆 ---------- */
let weekCols = [];
function renderWeek() {
  const cal = $('#calendar');
  cal.innerHTML = '';
  const days = getDays();
  const ppm = 1.1;
  let lo = parseHM(state.trip.dayStart) ?? 480, hi = parseHM(state.trip.dayEnd) ?? 1290;
  for (const e of state.events) { lo = Math.min(lo, e.startMin ?? parseHM(e.start) ?? 480); hi = Math.max(hi, (e.startMin ?? 0) + (e.durationMin || 60)); }
  lo = Math.max(0, Math.floor(lo / 60) * 60); hi = Math.min(1440, Math.ceil(hi / 60) * 60);
  if (hi - lo < 240) hi = lo + 240;
  const H = (hi - lo) * ppm;
  cal.style.gridTemplateColumns = `56px repeat(${days.length}, minmax(96px, 1fr))`;

  const corner = document.createElement('div'); corner.className = 'cal-corner'; cal.appendChild(corner);
  days.forEach((d, i) => {
    const h = document.createElement('button'); h.type = 'button';
    h.className = 'cal-dayhead' + (i === state.sel.dayIndex ? ' sel' : '');
    h.innerHTML = `${d.slice(5).replace('-', '/')}<small>${weekday(d)}</small>`;
    h.addEventListener('click', () => { state.sel.dayIndex = i; save(); renderCalendarOnly(); renderMapForSel(); });
    cal.appendChild(h);
  });

  const gut = document.createElement('div'); gut.className = 'cal-gutter'; gut.style.height = H + 'px'; gut.style.gridRow = '2';
  for (let m = lo; m <= hi; m += 60) {
    const t = document.createElement('div'); t.className = 'cal-tick'; t.style.top = (m - lo) * ppm + 'px'; t.textContent = fmtHM(m);
    gut.appendChild(t);
  }
  cal.appendChild(gut);

  const today = tzNowInTrip();
  weekCols = [];
  days.forEach((d, i) => {
    const col = document.createElement('div'); col.className = 'cal-col'; col.style.height = H + 'px'; col.dataset.date = d;
    if (d === today.date) col.classList.add('today-col');
    const evts = evSorted(dayEvents(i));
    let prev = null;
    for (const e of evts) {
      const b = document.createElement('div');
      b.className = `cal-block cat-${e.category}` + (e.locked ? ' locked' : '');
      if (prev && e.startMin < prev.startMin + prev.durationMin) b.classList.add('conflict');
      b.style.top = (e.startMin - lo) * ppm + 'px';
      b.style.height = Math.max(20, e.durationMin * ppm - 4) + 'px';
      b.dataset.id = e.id;
      b.tabIndex = 0;
      const icon = e.category === 'transit' ? '' : '';
      b.innerHTML = `<b>${icon}${esc(e.name)}</b><span class="t">${fmtHM(e.startMin)}–${fmtHM(e.startMin + e.durationMin)}</span>` +
        (e.cost != null && e.cost !== '' && state.settings.showCost ? ` <span class="t">${fmtMoney(localAmt(e), state.trip.currency)}</span>` : '');
      b.querySelector('.resize-handle') || b.appendChild(Object.assign(document.createElement('div'), { className: 'resize-handle' }));
      attachBlock(b, e, lo, ppm, days);
      col.appendChild(b);
      prev = e;
    }
    if (d === today.date && today.min >= lo && today.min <= hi) {
      const nl = document.createElement('div'); nl.className = 'nowline';
      nl.style.top = (today.min - lo) * ppm + 'px'; nl.dataset.t = fmtHM(today.min);
      col.appendChild(nl);
    }
    weekCols.push({ date: d, el: col });
    cal.appendChild(col);
  });
}
/* 拖移（長按 3 秒）與調整時長 */
let press = null;
function showHint(x, y, text) {
  const h = document.createElement('div'); h.className = 'longpress-hint'; h.textContent = text;
  h.style.left = (x + 12) + 'px'; h.style.top = (y - 26) + 'px'; document.body.appendChild(h); return h;
}
function attachBlock(b, e, lo, ppm, days) {
  b.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    if (ev.target.classList.contains('resize-handle')) { startResize(ev, b, e); return; }
    const hint = showHint(ev.clientX, ev.clientY, '按住不放 3 秒即可拖移');
    const timer = setTimeout(() => {
      hint.remove();
      if (e.locked) { toast('已預約時段已鎖定，先解除鎖定才能移動'); return; }
      press.dragging = true; b.classList.add('dragging');
      const cr = weekCols.map(c => { const r = c.el.getBoundingClientRect(); return { date: c.date, left: r.left, right: r.right }; });
      press.cols = cr; press.calRect = $('#calendar').getBoundingClientRect();
    }, 3000);
    press = { x: ev.clientX, y: ev.clientY, e, b, timer, moved: false, dragging: false, cols: null, target: null };
    try { b.setPointerCapture(ev.pointerId); } catch (err) { /* 合成/特殊 pointerId：唔影響拖曳 */ }
    b.__up = upEv => {
      if (!press) return;
      clearTimeout(press.timer); hint.remove();
      if (press.dragging) {
        b.classList.remove('dragging');
        if (press.target && !e.locked) {
          pushUndo(); e.date = press.target.date; e.start = fmtHM(press.target.min);
          save(); renderAll(); toast(`已移動「${e.name}」`);
        }
        press.b.__clickSuppress = true;
      }
      press = null;
    };
    b.addEventListener('pointerup', b.__up, { once: true });
    b.addEventListener('pointercancel', () => { clearTimeout(press?.timer); hint.remove(); press = null; }, { once: true });
  });
  b.addEventListener('pointermove', ev => {
    if (!press || press.b !== b) return;
    const dx = ev.clientX - press.x, dy = ev.clientY - press.y;
    if (!press.dragging) { if (Math.hypot(dx, dy) > 10) { clearTimeout(press.timer); press.moved = true; } return; }
    b.style.transform = `translate(${dx}px,${dy}px)`;
    let date = null;
    for (const c of press.cols) if (ev.clientX >= c.left && ev.clientX <= c.right) date = c.date;
    // 新分鐘 = 原開始時間 + 垂直位移換算（5 分鐘一格）
    const newMin = clamp((parseHM(e.start) ?? 480) + Math.round(dy / ppm / 5) * 5, 0, 1435);
    press.target = { date: date || e.date, min: newMin };
  });
  b.addEventListener('click', ev => {
    if (b.__clickSuppress) { b.__clickSuppress = false; return; }
    const di = getDays().indexOf(e.date);
    if (di >= 0 && di !== state.sel.dayIndex) { state.sel.dayIndex = di; save(); renderCalendarOnly(); renderMapForSel(); }
    toast(`${fmtHM(e.startMin)} ${e.name}（${fmtDur(e.durationMin)}）· 雙擊編輯`);
  });
  b.addEventListener('dblclick', () => openEventModal(e));
  b.addEventListener('keydown', ev => { if (ev.key === 'Enter') openEventModal(e); });
}
function startResize(ev, b, e) {
  ev.stopPropagation();
  const y0 = ev.clientY, d0 = e.durationMin;
  try { b.setPointerCapture(ev.pointerId); } catch (err) { /* 合成 pointerId 容錯 */ }
  const mv = m => {
    const nd = clamp(Math.round((d0 + (m.clientY - y0) / 1.1) / 5) * 5, 15, 16 * 60);
    b.style.height = Math.max(20, nd * 1.1 - 4) + 'px';
    b.__dur = nd;
  };
  const up = () => {
    b.removeEventListener('pointermove', mv);
    if (b.__dur && b.__dur !== d0 && !e.locked) { pushUndo(); e.durationMin = b.__dur; save(); renderAll(); }
    else renderAll();
  };
  b.addEventListener('pointermove', mv);
  b.addEventListener('pointerup', up, { once: true });
}

/* ---------- 單日時間軸 ---------- */
let lastDayRendered = null;
function mergedDayList(di) {
  const evts = evSorted(dayEvents(di));
  const out = [];
  let i = 0;
  while (i < evts.length) {
    const e = evts[i];
    if (e.category === 'transit' && (e.mode || 'train') === 'walk') {
      const grp = [e]; let j = i + 1, run = 0;
      while (j < evts.length && evts[j].category === 'transit' && (evts[j].mode || 'train') === 'walk') { grp.push(evts[j]); j++; }
      if (grp.length > 1) { out.push({ walkGroup: grp, startMin: grp[0].startMin, totalMin: grp.reduce((a, g) => a + g.durationMin, 0) }); i = j; continue; }
    }
    out.push(e); i++;
  }
  return out;
}
function renderDay() {
  const days = getDays();
  const di = clamp(state.sel.dayIndex, 0, days.length - 1);
  const date = days[di];
  const datesEl = $('#timelineDates');
  // 電站列
  [...datesEl.querySelectorAll('.tl-station')].forEach(n => n.remove());
  days.forEach((d, i) => {
    const s = document.createElement('button'); s.type = 'button'; s.dataset.di = i;
    s.className = 'tl-station' + (i === di ? ' sel' : '');
    s.innerHTML = `<span class="dnum">${d.slice(8)}</span><span class="dot"></span><span class="dlabel">${weekday(d)}</span>`;
    s.addEventListener('click', () => { state.sel.dayIndex = i; save(); renderCalendarOnly(); renderMapForSel(); });
    datesEl.appendChild(s);
  });
  // 插圖
  const evts = evSorted(dayEvents(di));
  const catMix = {}; evts.forEach(e => catMix[e.category] = (catMix[e.category] || 0) + 1);
  const override = state.settings.dayArt?.[di];
  const artKey = override && override !== 'auto' ? override : pickArt(evts, catMix);
  const il = $('#tlIllustration');
  il.innerHTML = artSVG(artKey);
  if (lastDayRendered !== null && lastDayRendered !== di) { il.classList.remove('go'); void il.offsetWidth; il.classList.add('go'); }
  lastDayRendered = di;
  positionIllustration();
  // intro
  const totalCost = evts.map(settleAmt).filter(v => v != null).reduce((a, b) => a + b, 0);
  const opts = ['auto', ...ART_KEYS].map(k => `<option value="${k}"${(override || 'auto') === k ? ' selected' : ''}>${k === 'auto' ? '自動（照行程）' : ART[k].name}</option>`).join('');
  $('#timelineIntro').innerHTML =
    `<span class="di bounce-in">第 ${di + 1} 天 · ${date.slice(5).replace('-', '/')}（${weekday(date)}）</span>` +
    `<span class="sub">${evts.length} 項行程${state.settings.showCost && totalCost ? ` · ≈ ${fmtMoney(totalCost, state.trip.settleCurrency)}` : ''}</span>` +
    `<label style="margin-left:auto;font-size:12px">🎨 插圖<select id="artSelect">${opts}</select></label>`;
  const diEl = $('#timelineIntro .di'); diEl.classList.add('bounce'); setTimeout(() => diEl.classList.remove('bounce'), 340);
  $('#artSelect').addEventListener('change', ev => {
    state.settings.dayArt = state.settings.dayArt || {};
    state.settings.dayArt[di] = ev.target.value; save(); renderCalendarOnly();
  });
  // 卡片列
  const cardsEl = $('#timelineCards');
  cardsEl.innerHTML = '';
  const list = mergedDayList(di);
  if (!list.length) {
    cardsEl.innerHTML = `<div class="panel" style="padding:18px;text-align:center">
      尚未有行程 — 按上方 <b>＋</b> 新增，或由底部工具籤<b>匯入行程</b>。也可以直接貼上你現有的行程文字。<br>
      <small>已設定日期：${state.trip.startDate || '未設定'} → ${state.trip.endDate || '未設定'} · 時區 ${esc(state.trip.timezone)}</small></div>`;
  }
  let prevEnd = null;
  for (const item of list) {
    const row = document.createElement('div'); row.className = 'timeline-time-row'; row.tabIndex = 0;
    if (item.walkGroup) {
      const first = item.walkGroup[0];
      row.innerHTML = `<div class="tt-time">${fmtHM(item.startMin)}<b>${fmtDur(item.totalMin)}</b></div>
        <div class="timeline-card cat-transit walk" data-id="${first.id}">
          <h4>步行 ${item.walkGroup.length} 段 · 共 ${fmtDur(item.totalMin)}</h4>
          <div class="segline">${modeIcon('walk')}<span>純步行已合併顯示</span></div>
          <div class="meta">${item.walkGroup.map(g => `${fmtHM(g.startMin)}`).join(' → ')}</div>
        </div>`;
      row.querySelector('.timeline-card').addEventListener('dblclick', () => openEventModal(first));
    } else {
      const e = item;
      const conflict = prevEnd != null && e.startMin < prevEnd;
      const costTxt = e.cost == null || e.cost === '' ? `<span class="cost est">待估</span>`
        : state.settings.showCost ? `<span class="cost">${fmtMoney(localAmt(e), state.trip.currency)}${e.costWho !== 'group' ? (e.costWho === 'person' ? '/人' : '/車') : ''}</span>` : '';
      const seg = e.category === 'transit'

          ${e.address ? `<div class="meta">📍 ${esc(e.address)}</div>` : ''}

          ${seg}
          ${conflict ? '<div class="conflict-warn">⚠ 與前一個行程時間重疊</div>' : ''}
        </div>`;
      const card = row.querySelector('.timeline-card');
      card.addEventListener('dblclick', () => openEventModal(e));
      if (e.category !== 'transit') card.addEventListener('click', () => { window.open && MapX.showDay(dayEvents(di), { route: true }); });
      prevEnd = Math.max(prevEnd ?? -1, e.startMin + e.durationMin);

}
function positionIllustration() {
  const st = document.querySelector('.tl-station.sel');
  const il = $('#tlIllustration');
  if (!st || !il) return;
  const x = st.offsetLeft + st.offsetWidth / 2 - il.offsetWidth / 2;
  il.style.left = Math.max(0, x) + 'px';
}
function updateTimelineEffects() {
  const listEl = $('#timelineList');
  if (!listEl || $('#dayview').hidden) return;
  const rows = [...$('#timelineCards').children];
  if (!rows.length) return;
  const lh = listEl.clientHeight, center = listEl.scrollTop + lh / 2;
  let best = 0, bestD = 1e9;
  for (const r of rows) {
    const c = r.offsetTop + r.offsetHeight / 2;
    const d = clamp(Math.abs(c - center) / (lh * 0.55), 0, 1);
    const card = r.querySelector('.timeline-card');
    if (card) card.style.setProperty('--b', d.toFixed(3));
    if (d < bestD) { bestD = d; best = rows.indexOf(r); }
  }
  rows.forEach((r, i) => r.classList.toggle('timeline-current', i === best));
  // 圓形追蹤
  const cur = rows[best];
  const dot = $('#scaleInner .scale-dot') || Object.assign(document.createElement('div'), { className: 'scale-dot' });
  $('#scaleInner').appendChild(dot);
  dot.style.top = (cur.offsetTop + 8) + 'px';
  // 紅線（只比對當地時分與當日範圍）
  const old = $('#scaleInner .scale-now'); if (old) old.remove();
  const days = getDays(), date = days[clamp(state.sel.dayIndex, 0, days.length - 1)];
  const now = tzNowInTrip();
  const evts = evSorted(dayEvents(state.sel.dayIndex));
  if (date === now.date && evts.length) {
    const t = now.min;
    const first = evts[0], last = evts[evts.length - 1];
    const firstEnd = last.startMin + last.durationMin;
    if (t >= first.startMin && t <= firstEnd) {
      let y = null;
      for (let i = 0; i < rows.length; i++) {
        const e = evts[i];
        const top = rows[i].offsetTop;
        const nxt = i + 1 < rows.length ? rows[i + 1].offsetTop : top + rows[i].offsetHeight;
        const t1 = i + 1 < rows.length ? evts[i + 1].startMin : firstEnd;
        if (t >= e.startMin && t <= t1) { y = top + (t - e.startMin) / Math.max(1, t1 - e.startMin) * (nxt - top); break; }
      }
      if (y != null) {
        const nl = Object.assign(document.createElement('div'), { className: 'scale-now' });
        nl.style.top = y + 'px'; nl.innerHTML = `<span>${fmtHM(t)}</span>`;
        $('#scaleInner').appendChild(nl);
      }
    }
  }
}

/* 匯入 */
const MODE_RE = { shinkansen: /新幹線|shinkansen/i, metro: /地铁|地鐵|地下鐵|metro|subway/i, bus: /公交|公車|巴士|bus/i, taxi: /計程車|打車|出租|taxi/i, plane: /搭機|转机|轉機|航班|飛機|flight/i, train: /新干线|特急|急行|電車|火車|列车|列車|JR|台場?線|高鐵/i };
const TRANSIT_RE = /新幹線|新干线|特急|急行|電車|火車|列车|列車|地铁|地鐵|地下鐵|公交|公車|巴士|搭機|轉機|转机|高鐵|JR(?!話)/i;
const FOOD_RE = /早餐|午餐|晚餐|早午餐|brunch|拉麵|拉面|壽司|寿司|餐廳|餐厅|居酒屋|燒肉|烧肉|燒烤|烤肉|咖啡|cafe|café|ramen|sushi|天婦羅| tempori|定食/i;
const STAY_RE = /入住|退房|check.?in|check.?out|飯店|酒店|民宿|住宿|hotel|airbnb/i;
const FLIGHT_RE = /航班|起飛|降落|抵達|搭機|转机|轉機|机场|機場|\b[NHJ][RTK][MJ]?\b.*(?:T[123])|NRT|HND|KIX|FUK|CTS|OIT/i;
function guessCat(line) {
  if (FLIGHT_RE.test(line)) return { category: 'flight', mode: 'plane', durationMin: 150 };
  if (TRANSIT_RE.test(line) || MODE_RE.train.test(line)) {
    let mode = 'train';
    for (const [k, re] of Object.entries(MODE_RE)) if (re.test(line)) { mode = k; break; }
    const dur = mode === 'shinkansen' ? 120 : mode === 'plane' ? 150 : mode === 'metro' || mode === 'train' ? 35 : mode === 'bus' ? 45 : 25;
    return { category: 'transit', mode, durationMin: dur };
  }
  if (FOOD_RE.test(line)) return { category: 'food', durationMin: 75 };
  if (STAY_RE.test(line)) return { category: 'stay', durationMin: 30 };
  return { category: 'sight', durationMin: 90 };
}
function parseItineraryText(txt) {
  const days = getDays();
  const base = dateValid(state.trip.startDate) ? state.trip.startDate : days[0];
  let curDay = 0, out = [];
  const lines = txt.split(/\r?\n/);
  for (const raw0 of lines) {
    const raw = raw0.replace(/&nbsp;/g, ' ').trim();
    if (!raw) continue;
    let dayMatch = raw.match(/(?:^|\s)(?:Day\.?\s*|D\.?\s*|第)\s*(\d{1,2})\s*(?:天|日)?\b/i) || raw.match(/^(\d{1,2})\s*天/);
    if (dayMatch) { curDay = (+dayMatch[1]) - 1; }
    const timeMatch = raw.match(/(\d{1,2})[:：.．](\d{2})/);
    if (!timeMatch) {
      // 「 Day1 淺草寺」無時間行：若行首有 day 標記且整行無時間，視為標題
      if (/^https?:/.test(raw) || raw.startsWith('#')) continue;
      continue;
    }
    let min = (+timeMatch[1]) * 60 + (+timeMatch[2]);
    if (min >= 1440) continue;
    let rest = raw.slice(timeMatch.index).replace(/\d{1,2}[:：.．]\d{2}/, '');
    rest = rest.replace(/^[\s\-–—:：、|·•>]+/, '').replace(/[-•·●▪▸*]\s*$/, '').trim();
    if (!rest) continue;
    let name = rest, notes = '';
    const split = rest.match(/\s+[—–]\s+|\s+·\s+/);
    if (split) { name = rest.slice(0, split.index).trim(); notes = rest.slice(split.index + split[0].length).trim(); }
    name = name.replace(/^[【[]?\d+[】\]]?\s*/, '').trim();
    if (!name) continue;
    const g = guessCat(raw);
    const locked = /(已訂|已訂購|已預約|已預訂|🔒|booked|✓)/i.test(raw);
    if (locked) name = name.replace(/\s*[\[（(【]?\s*(已訂|已訂購|已預約|已預訂|🔒|booked|✓)\s*[\]））】]?\s*/gi, ' ').trim();
    const date = dateAdd(base, curDay);
    out.push({
      id: uid('i'), name, date, start: fmtHM(min), durationMin: g.durationMin,
      category: g.category, mode: g.mode || 'train', legNote: '', address: name,
      cost: null, costWho: 'person', notes, locked,
    });
    curDay = curDay; // keep
  }
  return out;
}
function importJsonText(txt) {
  const j = JSON.parse(txt);
  let events = null;
  if (Array.isArray(j)) events = j;
  else if (Array.isArray(j.events)) events = j.events;
  if (!events) throw new Error('找不到 events');
  return {
    events: events.map(e => ({
      id: e.id || uid('j'), date: e.date, start: e.start || '09:00',
      durationMin: Math.max(5, +e.durationMin || +e.duration || 90),
      category: e.category || 'sight', mode: e.mode || 'train', legNote: e.legNote || '',
      name: e.name || '未命名', address: e.address || '', notes: e.notes || '',
      cost: e.cost == null || e.cost === '' ? (e.costs?.amount ?? e.cost?.amount ?? null) : +e.cost,
      costWho: e.costWho || 'person', locked: !!e.locked,
    })).filter(e => dateValid(e.date)),
    trip: j.trip || null,
    packing: Array.isArray(j.packing) ? j.packing.map(p => ({
      id: uid('p'), cat: p.cat || '其他', name: p.name || '未命名',
      qty: Math.max(1, +p.qty || 1), done: !!p.done, note: p.note || '',
    })) : null,
  };
}
function doImport() {
  const txt = $('#importText').value.trim();
  if (!txt) { toast('請貼上文字或 JSON'); return; }
  let parsed, via = '';
  try { parsed = importJsonText(txt); via = 'JSON'; }
  catch (err) { parsed = { events: parseItineraryText(txt) }; via = '文字'; }
  if (!parsed.events.length) { toast('解析不到行程（試試「09:00 地點名」格式）'); return; }
  pushUndo();
  state.events = parsed.events;
  if (parsed.trip) {
    state.trip = { ...state.trip, ...parsed.trip };
    if (parsed.trip.timezone && !state.trip.timezone) state.trip.timezone = 'Asia/Tokyo';
  }
  if (parsed.packing) state.packing = parsed.packing;
  state.sel.dayIndex = 0;
  save(); closeOverlay(); renderAll();
  toast(`已用${via}方式匯入 ${parsed.events.length} 項行程${parsed.packing ? `＋${parsed.packing.length} 項用品` : ''}${parsed.trip ? '＋旅程設定' : ''} · Ctrl+Z 可還原`);
}
$('#importDoBtn').addEventListener('click', doImport);
$('#importCancelBtn').addEventListener('click', closeOverlay);
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  $('#importText').value = await f.text();
  doImport();
});
$('#overlay').addEventListener('click', ev => { if (ev.target.id === 'overlay') closeOverlay(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeOverlay();
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(); }
});

/* ---------- 匯出 ---------- */
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function exportICS() {
  const evts = [...state.events].sort((a, b) => (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')));
  if (!evts.length) { toast('尚無行程可匯出'); return; }
  const d0 = evts[0].date;
  const off = tzOffsetMin(state.trip.timezone, d0);
  const offS = icsOffsetStr(off);
  const escICS = s => String(s || '').replace(/\\/g, '\\\\').replace(/([,;.])/g, '\\$1').replace(/\n/g, '\\n');
  const fold = l => (l.length <= 74 ? l : l.slice(0, 74) + '\r\n ' + fold(l.slice(74)));
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//jp-trip-planner//TW', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE', `TZID:${state.trip.timezone}`, 'BEGIN:STANDARD',
    `DTSTART:${d0.replace(/-/g, '')}T000000`, `TZOFFSETFROM:${offS}`, `TZOFFSETTO:${offS}`, 'TZNAME:STANDARD',
    'END:STANDARD', 'END:VTIMEZONE'];
  for (const e of evts) {
    e.startMin = parseHM(e.start) ?? 480;
    const st = e.date.replace(/-/g, '') + 'T' + (e.start || '09:00').replace(':', '') + '00';
    const enMin = e.startMin + (e.durationMin || 60);
    let enDay = e.date;
    if (enMin >= 1440) { enDay = dateAdd(e.date, Math.floor(enMin / 1440)); }
    const en = enDay.replace(/-/g, '') + 'T' + fmtHM(enMin).replace(':', '') + '00';
    const icon = e.category === 'transit' ? (e.mode === 'walk' ? '🚶 ' : e.mode === 'shinkansen' ? '🚄 ' : e.mode === 'plane' ? '✈️ ' : '🚇 ') : '';
    lines.push('BEGIN:VEVENT', `UID:${e.id}@jp-trip-planner`,
      fold(`SUMMARY:${escICS(icon + e.name)}`),
      `DTSTART;TZID=${state.trip.timezone}:${st}`,
      `DTEND;TZID=${state.trip.timezone}:${en}`,
      e.address ? fold(`LOCATION:${escICS(e.address)}`) : null,
      e.notes ? fold(`DESCRIPTION:${escICS(e.notes + (e.cost != null ? ` · ${e.cost} ${state.trip.currency}(${e.costWho})` : ''))}`) : null,
      'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  download('trip.ics', lines.filter(Boolean).join('\r\n'), 'text/calendar');
  toast('已下載 trip.ics：到你的裝置開啟或匯入 iCloud／Google 行事曆');
}
function exportJSON() {
  const out = { trip: state.trip, events: state.events, packing: state.packing, exportedAt: new Date().toISOString() };
  download('trip-data.json', JSON.stringify(out, null, 2), 'application/json');
  toast('已下載 trip-data.json');
}

  $('#fabmenu').classList.remove('open'); $('#fab').setAttribute('aria-expanded', 'false');
}

/* ---------- 點樣去（A→B 公共交通班次，Google Directions TRANSIT） ---------- */
function transitQuery(e) { return (e.address || e.name || '').trim(); }
function transitAvailable() {
  return MapX.mode === 'google' || !!(window.google && window.google.maps && window.google.maps.DirectionsService);
}
function transitEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function transitDepartMs(dateStr, timeStr) {
  const p = dateStr.split('-').map(Number);
  const t = (timeStr || '09:00').split(':').map(Number);
  if ((state.trip.timezone || 'Asia/Tokyo') === 'Asia/Tokyo') return Date.UTC(p[0], p[1] - 1, p[2], t[0], t[1]) - 9 * 3600e3;
  return new Date(p[0], p[1] - 1, p[2], t[0], t[1]).getTime();
}
function tzHM(ms) {
  if (!ms) return '';
  if ((state.trip.timezone || 'Asia/Tokyo') === 'Asia/Tokyo') { const d = new Date(ms + 9 * 3600e3); return pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()); }
  const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function openTransit() {
  if (!transitAvailable()) { toast('搵實際班次要用 Google Maps key：喺 ⚙ 設定輸入 key（專案要開通 Directions API）；開源地圖淨係畫到線，查唔到車班次'); return; }
  const evts = evSorted(state.events.filter(e => transitQuery(e)));
  if (evts.length < 2) { toast('最少要有兩個有名稱／地址嘅地點先至用到（地點編輯入面可以填地址）'); return; }
  const mk = (sel, wantId) => {
    sel.innerHTML = '';
    evts.forEach(e => {
      const o = document.createElement('option');
      o.value = e.id; o.textContent = `${e.date} ${e.start} ${e.name}`;
      if (e.id === wantId) o.selected = true;
      sel.appendChild(o);
    });
  };
  mk($('#trFrom'), evts[0].id);
  const qA = transitQuery(evts[0]);
  const eB = evts.find(e => transitQuery(e) !== qA) || evts[evts.length - 1];
  mk($('#trTo'), eB.id);
  const days = getDays();
  const dsel = $('#trDate'); dsel.innerHTML = '';
  const all = days.includes(evts[0].date) ? days : [...days, evts[0].date].sort();
  all.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d + `（第 ${all.indexOf(d) + 1} 天）`;
    if (d === evts[0].date) o.selected = true;
    dsel.appendChild(o);
  });
  $('#trTime').value = evts[0].start || '09:00';
  $('#trResults').innerHTML = '';
  openOverlay('transitModal');
}
let trBusy = false;
function runTransit() {
  if (trBusy) return;
  const eA = state.events.find(e => e.id === $('#trFrom').value);
  const eB = state.events.find(e => e.id === $('#trTo').value);
  if (!eA || !eB) return;
  if (eA.id === eB.id) { toast('起點同終點要唔同地點㗎'); return; }
  const departMs = transitDepartMs($('#trDate').value, $('#trTime').value);
  if (departMs < Date.now() - 60e3) { toast('出發時間已經過咗（行程日係未來就冇事）；改返日子／時間'); return; }
  trBusy = true;
  const btn = $('#trGoBtn');
  btn.disabled = true; btn.textContent = '搵緊…';
  $('#trResults').innerHTML = '<p class="hint">⏳ 搵緊班次，要 1–3 秒…</p>';
  MapX.transitSearch(transitQuery(eA), transitQuery(eB), departMs).then(r => {
    trBusy = false; btn.disabled = false; btn.textContent = '搵班次';
    $('#trResults').innerHTML = r.error ? transitErrHtml(r.error) : transitRoutesHtml(r.routes, departMs);
  });
}
function transitErrHtml(err) {
  const hints = {
    NO_KEY: '未輸入 Google Maps key（⚙ 設定填 key 先至查到班次）',
    REQUEST_DENIED: 'key 未開通 Directions API，或者 key 有來源限制',
    INVALID_REQUEST: 'Google 搵唔到其中一個地點：將該地點嘅地址改做清楚啲嘅站名／POI 名',
    ZERO_RESULTS: '兩個地點之間查唔到公共交通：試下改用對近嘅站名做起點／終點',
  };
  return `<p class="hint">查唔work：${transitEsc(err)}${hints[err] ? '——' + hints[err] : ''}。改起點／終點或時間再試。</p>`;
}
function transitRoutesHtml(routes, departMs) {
  let html = '';
  routes.forEach((r, i) => {
    let run = departMs, totDur = 0;
    const legHtml = r.legs.map(l => {
      const dep = l.dep || run, arr = l.arr || dep + (l.dur || 0) * 1000;
      run = arr; totDur += (l.dur || 0);
      const mins = Math.max(1, Math.round((l.dur || 0) / 60));
      if (l.mode === 'WALKING') {
        return `<div class="tr-leg"><span class="tr-ico">🚶</span><div>行 ${mins} 分鐘${l.to ? `<span class="tr-addr">${transitEsc(l.to)}</span>` : ''}</div></div>`;
      }
      if (l.mode === 'DRIVING') {
        return `<div class="tr-leg"><span class="tr-ico">🚕</span><div><b>計程車／自駕</b> ${tzHM(dep)} 上車 → ${tzHM(arr)} 落車（${mins} 分鐘）${l.dist ? ` ${transitEsc(l.dist)}` : ''}${l.from ? `<span class="tr-addr">${transitEsc(l.from)} → ${transitEsc(l.to)}</span>` : ''}</div></div>`;
      }
      const icon = /bus|巴士|バ[スス]|auto|public transit line/i.test(l.line + ' ' + l.short) && !/線|線|rail|subway|tram/i.test(l.line) ? '🚌' : '🚃';
      const lineTxt = transitEsc(l.line || l.short || '公共交通工具');
      const extra = [];
      if (l.short && transitEsc(l.short) !== lineTxt) extra.push(`（${transitEsc(l.short)}）`);
      if (l.head) extra.push(` · 往 ${transitEsc(l.head)}`);
      return `<div class="tr-leg"><span class="tr-ico">${icon}</span><div><b>${lineTxt}</b>${extra.join('')} ${tzHM(dep)} 上車 → ${tzHM(arr)} 落車（${mins} 分鐘）${l.dist ? ` ${transitEsc(l.dist)}` : ''}${l.from ? `<span class="tr-addr">${transitEsc(l.from)} → ${transitEsc(l.to)}</span>` : ''}</div></div>`;
    }).join('');
    const first = r.legs[0], last = r.legs[r.legs.length - 1];
    const depT = (first && first.dep) || departMs;
    const arrT = (last && last.arr) || departMs + totDur * 1000;
    html += `<div class="tr-card"><h4>方案 ${i + 1}｜${tzHM(depT)} 上車 → ${tzHM(arrT)} 到（全程 ${Math.round(totDur / 60)} 分鐘）${r.summary ? ` · ${transitEsc(r.summary)}` : ''}</h4>${legHtml}</div>`;
  });
  if (routes.length > 1) html += '<p class="hint">幾個方案同時顯示＝假設頭班 miss 咗，接住仲可以搭邊班；想再等遲啲就加大出發時間再搵。</p>';
  return html;
}
$('#transitBtn').addEventListener('click', openTransit);
$('#trGoBtn').addEventListener('click', runTransit);
$('#trCloseBtn').addEventListener('click', closeOverlay);

/* ---------- 啟動 ---------- */
function maybeWelcome() {
  if (!state.events.length && !lsGet('jp-trip-welcomed')) {
    lsSet('jp-trip-welcomed', '1');
    toast('旅程一開始是空白：按右上方＋新增，或底部工具籤⚙先設定日期與匯入行程');
  }
}
(function boot() {
  $('#brandsvg').innerHTML = BRAND_SVG;
  MapX.init($('#mapframe'));
  $('#undoBtn').disabled = history.length === 0;
  if (state.settings.mapMode === 'route') $('#previewroute').classList.add('active'); else $('#mapfit').classList.add('active');
  renderAll();
  MapX.setKey(state.settings.mapsKey || '').then(() => renderMapForSel());
  if (CLOUD) {
    // 雲端模式：本機 localStorage 只係鏡像；以雲端嗰份為準（每個 Google 帳號自己一份）
    setChip('⏳ 載入雲端行程…');
    google.script.run
      .withSuccessHandler(info => {
        if (info && info.json) {
          try { applyState(JSON.parse(info.json)); } catch (e) { /* 雲端資料壞咗就用本機鏡像 */ }
          lastSync = info.savedAt || 0;
          $('#previewroute').classList.toggle('active', state.settings.mapMode === 'route');
          $('#mapfit').classList.toggle('active', state.settings.mapMode !== 'route');
          renderAll();
          MapX.setKey(state.settings.mapsKey || '').then(() => renderMapForSel());
        } else if (lsGet(STORE_KEY)) {
          pushCloud(); // 第一次行雲端：自動將本機舊行程搬上去
        }
        const who = (info && info.email) || (typeof USER_EMAIL !== 'undefined' ? USER_EMAIL : '');
        setChip(who ? '☁ ' + who : '☁ 已同步');
        maybeWelcome();
      })
      .withFailureHandler(() => setChip('⚠️ 雲端連線失敗（編輯照樣得，改動會重試同步）'))
      .loadAll();
  } else {
    maybeWelcome();
  }
})();
